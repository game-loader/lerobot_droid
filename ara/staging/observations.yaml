    provenance: ai-suggested
    content: The final two DDIM transitions appear disproportionately ratio-sensitive because their effective sigmas are much smaller than the preceding transitions; changing the sigma floor may alter both exploration and final action quality and therefore needs evaluation before adoption.
    context: The fixed-old CUDA comparison localized the widest ratio upper tails to the penultimate and final denoising transitions.
    potential_type: claim
    bound_to: [N05]
    promoted: false
