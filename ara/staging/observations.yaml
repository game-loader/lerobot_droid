    provenance: ai-suggested
    content: Accepted AM-Q behavior-policy promotions did not produce monotonic Newton success in the completed sync-count run; the highest measured checkpoint occurred at sync 10, while the final sync 50 checkpoint was lower.
    context: Ten checkpoint-based 100-episode Newton evaluations measured 65% success at sync 10 and 43% at sync 50 while all 50 behavior synchronizations were accepted through the modeled AM-Q gate.
