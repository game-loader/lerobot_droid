    provenance: ai-suggested
    content: Processor compatibility checks should compare the statistics consumed by the configured normalization mode and tolerate representation-only differences in unused auxiliary metadata such as count.
    context: The first production rollout from sync 10 failed because scalar versus length-one count serialization was compared even though MIN_MAX action min/max were identical; a focused repair and real CUDA collector smoke resolved the failure.
