  - id: O02
    timestamp: "2026-08-18T19:01:40+08:00"
    provenance: ai-suggested
    content: A full action-chunk ratio multiplies likelihood contributions from every valid action time and active action dimension, so its log-ratio variance grows with the joint event count.
    context: The production checkpoint used 32 valid action steps and 5 active dimensions, producing 160 joint events per complete chunk.
    potential_type: architecture
    bound_to: [N05, N06]
    promoted: false
    promoted_to: null
    crystallized_via: null
    stale: false
  - id: O03
    timestamp: "2026-08-18T19:37:56+08:00"
    provenance: user
    content: Separating DDIM rollout sampling variance from PPO surrogate likelihood variance can preserve fixed-policy rollout actions while preventing near-zero tail variance from dominating likelihood ratios.
    context: The user prescribed a DPPO-style probability floor independent of rollout noise; matched CUDA and deterministic regression tests validated the implementation.
    potential_type: claim
    bound_to: [N07, N08]
    promoted: true
    promoted_to: logic/claims.md:C02
    crystallized_via: empirical-resolution-and-verbal-affirmation
    stale: false
  - id: O04
    timestamp: "2026-08-18T19:37:56+08:00"
    provenance: user
    content: Sample stored DDIM transitions with sigma_sample, but compute both old and new Gaussian log likelihoods on that same transition with sigma_prob=max(sigma_sample, probability_sigma_min).
    context: This is the implementation rule selected to stabilize diffusion PPO without changing exploration noise.
    potential_type: heuristic
    bound_to: [N07, N08]
    promoted: true
    promoted_to: logic/solution/heuristics.md:H01
    crystallized_via: artifact-commitment
    stale: false
  - id: O05
    timestamp: "2026-08-18T21:07:13+08:00"
    provenance: ai-suggested
    content: When the old snapshot is synchronized after every single actor update and PPO likelihood statistics are captured only before that update, ratio and KL diagnostics are structurally trivial and clipping is inactive for the only optimization evaluation.
    context: The user observed that all actor diagnostics stayed constant; a full-run metric audit and code-path trace localized the cause to evaluation and synchronization order.
    potential_type: claim
    bound_to: [N11, N12]
    promoted: true
