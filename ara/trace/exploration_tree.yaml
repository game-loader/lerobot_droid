  - id: N57
    type: experiment
    title: Harden resumable IL checkpoint evaluation provenance
    provenance: ai-executed
    timestamp: "2026-08-21T20:43:31+08:00"
    result: >-
      IL Newton evaluation reuse now requires a valid eval_info artifact and an
      exact atomic provenance sidecar binding checkpoint path and tree hash,
      rollout size, inference settings, devices, environment type, and seed.
      Stale or interrupted single-point directories are safely rebuilt without
      following symlinks outside the evaluation root. The RL100 suite passed
      312 tests with 2 expected skips; Ruff, format, and bytecode compilation
      checks passed.
    evidence:
      - RL/cli/train_iterative_offline.py
      - RL/cli/eval_il_checkpoints.py
      - tests/rl100/test_iterative_offline.py
    status: resolved
    also_depends_on: [N29, N39]
  - id: N58
    type: experiment
    title: Close the trainer-to-selector provenance loop
    provenance: ai-executed
    timestamp: "2026-08-21T20:51:27+08:00"
    result: >-
      LeRobot training now writes the same checkpoint-bound atomic provenance
      sidecar after a same-step checkpoint save and successful periodic eval.
      A regression proved that the downstream IL evaluation stage reuses this
      trainer artifact without launching a subprocess, while eval-only steps
      without a newly saved checkpoint write no sidecar. The expanded suite
      passed 318 tests with 2 expected skips.
    evidence:
