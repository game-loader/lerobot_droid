    result: The CUDA run completed 100000 IQL updates, 24250 actor updates, 485 AM-Q promotion attempts, and 50 behavior-policy synchronizations. Ten checkpoint-based 100-episode Newton evaluations were recorded at sync counts 5 through 50, and the final full RL checkpoint loaded successfully with no residual training or evaluation process.
