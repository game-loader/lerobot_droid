  - id: N40
    type: dead_end
    title: Require identical serialized auxiliary processor statistics
    provenance: ai-executed
    timestamp: "2026-08-19T21:04:27+08:00"
    hypothesis: A loadable policy checkpoint must store every action processor statistic with exactly the same field set, tensor shape, and value in its preprocessor and postprocessor.
    failure_mode: The independently evaluated sync 10 snapshot preserved identical MIN_MAX action bounds but serialized the unused action count as a scalar in the preprocessor and a length-one tensor in the postprocessor, so strict auxiliary-stat equality blocked collection before environment initialization.
    lesson: Validate strict equality only for statistics consumed by the configured normalization mode; auxiliary metadata representation must not invalidate an otherwise semantically equivalent checkpoint.
    status: resolved
    also_depends_on: [N29, N33, N38]
  - id: N41
    type: experiment
    title: Repair and verify periodic snapshot loading
    provenance: ai-executed
    timestamp: "2026-08-19T21:04:27+08:00"
    result: A regression retained strict MIN_MAX bound mismatch rejection while accepting auxiliary count shape differences; the real sync 10 snapshot loaded on CUDA, and a two-episode Newton smoke published one successful and one failed episode.
    evidence:
