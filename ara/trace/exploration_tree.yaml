  - id: N07
    type: decision
    title: Separate DDIM sampling and PPO probability sigma
    provenance: user
    timestamp: "2026-08-18T19:37:56+08:00"
    choice: Preserve the existing DDIM rollout transition with sigma_sample while evaluating both old and new PPO likelihoods with sigma_prob=max(sigma_sample, probability_sigma_min), defaulting the probability floor to 0.1.
    alternatives:
      - Raise the rollout sampling floor and change exploration behavior.
      - Continue using one sigma for both sampling and likelihood evaluation.
      - Exclude low-sigma tail transitions from the PPO objective.
    evidence: [N05]
    status: resolved
    also_depends_on: [N05]
  - id: N08
    type: experiment
    title: Validate separate probability sigma
    provenance: ai-executed
    timestamp: "2026-08-18T19:37:56+08:00"
    result: A matched fixed-reference CUDA A/B reduced update-3 approximate KL from 0.092152 to 0.005444, ratio q95 from 1.430237 to 1.119735, ratio max from 2.499312 to 1.151274, and clip fraction from 0.225 to 0.075. A fixed-seed regression kept sampled latents and actions bitwise identical, and the full RL suite passed 258 tests with 2 CUDA-dependent skips.
    evidence:
      - /tmp/rl100-diag-fixed-old-wIoCYh/metrics.jsonl
      - /tmp/rl100-prob-sigma-0qZWnR/metrics.jsonl
