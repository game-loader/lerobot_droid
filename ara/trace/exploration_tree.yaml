    status: resolved
    also_depends_on: [N10]
  - id: N12
    type: dead_end
    title: Immediate-sync pre-update PPO monitoring
    provenance: ai-executed
    timestamp: "2026-08-18T21:07:13+08:00"
    hypothesis: With one actor update per behavior snapshot, the existing ratio and approximate-KL metrics would still reveal the size and stability of that update.
    failure_mode: All 30165 actor rows recorded unit ratios and zero KL because old and current policies were identical during likelihood evaluation; the optimizer step occurred afterward and the old snapshot was immediately synchronized.
    lesson: Meaningful monitoring requires recomputing current-policy likelihood on the same stored transition after optimizer.step and before snapshot synchronization. Actual PPO clipping additionally requires more than one optimization evaluation per behavior snapshot.
    status: resolved
    also_depends_on: [N03, N07, N11]
  - id: N13
    type: question
    title: Audit offline PPO and AM-Q fidelity
    provenance: user
    timestamp: "2026-08-18T21:30:34+08:00"
    description: Determine whether every actor step updates policy, whether KL compares old and new policy on the same transition, and whether the migrated training path actually uses the paper's AM-Q gate.
    status: resolved
    also_depends_on: [N12]
  - id: N14
    type: experiment
    title: Compare paper, original code, and migrated offline loop
    provenance: ai-executed
    timestamp: "2026-08-18T21:30:34+08:00"
    result: >-
      The migration performs one optimizer update per actor batch and does replay
      the same stored transition for old/current likelihoods, but immediate
      snapshot synchronization makes the comparison pre-update and trivial.
      IQL Q-minus-V advantage is active. AM-Q is not active: dynamics and
      promotion-gate classes exist, but the CLI instantiates neither and performs
      no model rollout, OPE comparison, or conditional snapshot promotion. The
      original code instead keeps old policy fixed and conditionally promotes it
      after modeled-Q evaluation.
    evidence:
      - ara/evidence/tables/rl100-offline-parity-audit.md
      - /tmp/rl100-arxiv-2510.14830.txt
      - /home/droid/project/RL-100/RL-100/train.py
      - /home/droid/project/RL-100/RL-100/rl_100/unidpg/uni_ppo.py
      - RL/cli/train_offline.py
      - RL/trainers/offline.py
      - RL/algorithms/dynamics.py
    status: resolved
    also_depends_on: [N13]
  - id: N29
    type: decision
    title: Evaluate saved policy checkpoints instead of live memory state
    provenance: user
    timestamp: "2026-08-19T14:00:00+08:00"
    choice: Save a loadable policy checkpoint at each evaluation boundary and make the independent Newton evaluator load that checkpoint.
    alternatives:
      - Evaluate the current in-memory policy directly.
      - Save only the final policy and defer all rollout evaluation.
    evidence:
      - RL/cli/train_offline.py
    status: resolved
    also_depends_on: [N27]
  - id: N30
    type: decision
    title: Measure the actor phase by behavior-policy synchronizations
    provenance: user
    timestamp: "2026-08-19T14:20:00+08:00"
    choice: Stop after 50 old-policy synchronizations and save plus evaluate 100 Newton episodes every 5 synchronizations; do not impose an actor-update cap for promotion stalls.
    alternatives:
      - Stop after 50000 actor optimizer updates and evaluate every 5000 updates.
      - Stop at a wall-clock deadline.
    evidence:
      - RL/cli/train_offline.py
      - RL/README.md
    status: resolved
    also_depends_on: [N26, N29]
  - id: N31
    type: experiment
    title: Verify sync-count scheduling and checkpoint-based Newton evaluation
    provenance: ai-executed
    timestamp: "2026-08-19T14:30:00+08:00"
    result: The sync-target smoke stopped at one completed old-policy synchronization, saved a loadable sync checkpoint, ran one headless Newton episode from that checkpoint, and wrote eval/old_policy_sync_count into the actor metrics row. The RL test suite passed 270 tests with one expected skip; Ruff, mypy, and diff checks passed.
    evidence:
