  - id: N37
    type: experiment
    title: Audit LeRobot processor statistic updates
    provenance: ai-executed
    timestamp: "2026-08-19T17:55:00+08:00"
    result: Normalization statistics are converted to fixed processor tensors during initialization and are not policy parameters or optimizer state. MIN_MAX normalization applies an unclipped affine transform, so values beyond stored bounds map outside the nominal normalized interval.
    evidence:
