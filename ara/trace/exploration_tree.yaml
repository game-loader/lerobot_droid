  - id: N03
    type: decision
    title: Use conservative actor defaults
    provenance: ai-suggested
    timestamp: "2026-08-18T19:01:40+08:00"
    choice: Reduce default actor LR from 1e-5 to 1e-6, keep PPO actor epochs at 1, and synchronize the offline old-policy snapshot after each actor update by default.
    alternatives:
