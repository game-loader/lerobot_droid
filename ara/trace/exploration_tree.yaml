  - id: N11
    type: decision
    title: Stop the invariant-metric actor run
    provenance: user
    timestamp: "2026-08-18T21:07:13+08:00"
    choice: Interrupt the live actor run before completion because negative near-zero loss and invariant PPO diagnostics required explanation.
