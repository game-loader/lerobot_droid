entries:
  - turn: "2026-08-18_001#1"
    notes:
      - Crystallized C01 via artifact commitment because the trainer default now synchronizes snapshots based on the observed cumulative drift.
      - Kept tail-sigma sensitivity staged because changing sigma affects rollout behavior and has not been evaluated for success rate.
      - Kept joint-event amplification staged because only one action-chunk configuration has been measured.
      - Did not mark C01 supported; the short matched smoke is evidence but the user has not yet affirmed the interpretation and extended runs remain open.
  - turn: "2026-08-18_001#2"
    notes:
      - Crystallized C02 as supported because the user explicitly selected the decoupled-sigma mechanism and matched CUDA plus deterministic replay evidence resolved its immediate numerical and rollout-preservation claims.
      - Crystallized H01 via artifact commitment because both sampling and replay paths now enforce the same separate probability-sigma contract.
      - Left O01 staged: its warning remains applicable to changing the sampling sigma itself, while C02 distinguishes the independent probability-only floor.
      - Did not advance C01; this turn addressed tail likelihood sensitivity rather than extended behavior-snapshot drift.
  - turn: "2026-08-18_001#3"
    notes:
      - Routed the 50000-update bound as a user decision and the live launch verification as an experiment.
      - Did not stage a stability claim from the live run because only the first hundreds of actor updates have completed.
      - Kept C02 supported: the production row independently confirmed the configured sampling/probability sigma split and exact old-policy replay.
  - turn: "2026-08-18_001#4"
    notes:
      - Routed the user-requested interruption as N11 and the failed monitoring assumption as dead end N12.
      - Crystallized C03 at testing via empirical resolution; the mechanism is directly supported by code and all production rows, but a corrected post-update probe has not yet been implemented.
      - Did not treat signed near-zero surrogate loss as instability: normalized advantages make its value approximately zero at unit ratio while its score-function gradient can remain nonzero.
      - Did not advance C02 because the issue is metric timing and snapshot cadence, not the separate-sigma likelihood.
  - turn: "2026-08-18_001#5"
    notes:
      - Crystallized C04 via empirical resolution after directly comparing the paper, original offline loop, and migrated executable path.
      - Recorded the AM-Q omission as an implementation-parity result rather than silently treating the unused dynamics and gate classes as feature completion.
      - Kept C03 at testing; original-code comparison reinforces its mechanism, but the corrected candidate/snapshot loop remains unimplemented.
      - Distinguished the paper's explicit relative AM-Q margin from the public repository block, which promotes on any modeled-Q improvement.
  - turn: "2026-08-19_001#2"
    notes:
      - Routed checkpoint-based evaluation and sync-count termination as user decisions because the user explicitly replaced the prior actor-update schedule.
      - Routed the completed production run and success curve as experiments with direct artifact bindings.
      - Staged O07 instead of crystallizing it: the non-monotonic AM-Q versus Newton relationship is empirically visible, but the user has not yet interpreted or affirmed that conclusion.
      - Did not revise C04; the completed run confirms AM-Q is active as a separate promotion gate, but C04 already states that architecture and remains appropriately at testing.
  - turn: "2026-08-19_001#3"
    notes:
      - Routed the checkpoint and normalization clarification as question N34.
      - Kept the proposed warm-start rule out of the logic layer because the user asked for an explanation but has not yet approved the outer-loop design.
      - Verified that non-resume LeRobot training loads pretrained policy weights and creates fresh optimizer state.
      - Corrected the provisional normalization recommendation after auditing RL-100: off2off/use_pre_norm reuses the pre-dataset normalizer, so the implementation must not silently substitute merged-dataset statistics when exact warm-start parity is requested.
  - turn: "2026-08-19_001#4"
    notes:
      - Routed the normalizer-drift question as N36 and the live-code audit as N37.
      - Did not stage a new claim because the result is a direct implementation fact rather than a broader research relationship.
      - Identified an implementation-time diagnostic: measure expanded-data bound violations and normalized-value tails before deciding whether fixed old statistics remain appropriate.
  - turn: "2026-08-19_001#5"
    notes:
      - Routed the requested finite outer-loop boundary as decision N38 and the live launch as open experiment N42 because IL, offline RL, and the final collection tail are still running.
      - Recorded the rejected all-stat processor equality assumption as dead end N40; its failure occurred before rollout and was resolved by mode-required-stat validation plus a real CUDA smoke.
      - Crystallized O07 into C05 via artifact commitment because the production orchestrator selected the measured best sync checkpoint rather than the final checkpoint for data collection.
      - Crystallized O08 into H02 via artifact commitment after focused regression, full-suite verification, real checkpoint CUDA loading, and canonical collection smoke.
      - Did not advance C05 beyond testing: one completed promotion curve and one subsequent collection do not establish general monotonicity behavior across repeated runs.
  - turn: "2026-08-21_001#1"
    notes:
      - Routed the provenance and recovery verification as direct experiment N57 because it records an implemented and tested workflow change.
      - Did not stage a research claim: the turn established cache-integrity mechanics, not a new relationship about policy learning or environment success.
      - Kept trainer-side sidecar emission as an open thread because current in-training eval_info files cannot satisfy the new exact reuse contract.
  - turn: "2026-08-21_001#2"
