# TMR competition-site ROS graph. This template intentionally remains invalid
# until the two gripper calibration endpoints have been measured and filled in.
input_mode: tmr_split
include_spine: false
fps: 15
dataset_name: franka_duo_tmr_real
robot_type: franka_duo_tmr_real
task: "TMR Franka Duo real-robot demonstration"
output_root: datasets/franka_duo

topics:
  # FR3 controller state broadcasters. Confirm both are sensor_msgs/JointState
  # after the dual-arm controller is running.
  left_measured_joint_states: /left/franka_robot_state_broadcaster/measured_joint_states
  right_measured_joint_states: /right/franka_robot_state_broadcaster/measured_joint_states
  left_desired_joint_states: /left/franka_robot_state_broadcaster/desired_joint_states
  right_desired_joint_states: /right/franka_robot_state_broadcaster/desired_joint_states

  # GELLO gripper commands are std_msgs/Float32 open fractions in [0, 1].
  left_gripper_target: /left/gripper/gripper_client/target_gripper_width_percent
  right_gripper_target: /right/gripper/gripper_client/target_gripper_width_percent

  # Robotiq measured joints are sensor_msgs/JointState. If either message has
  # more than one position, set its selected name below after an on-site echo.
  left_gripper_joint_states: /left/gripper/joint_states
  right_gripper_joint_states: /right/gripper/joint_states

cameras:
  # ZED-M guide stream. depth_registered must be aligned to this rectified RGB
  # optical frame. The current TMR guide reports approximately 14-15 Hz.
  head:
    image: /head_camera/zed/rgb/color/rect/image
    depth: /head_camera/zed/depth/depth_registered
    camera_info: /head_camera/zed/rgb/color/rect/camera_info
    width: 1280
    height: 720
    fps: 15
    record_depth: true

  # The current TMR guide launches both D405 source streams at 640x480x30.
  # Samples are logically paired to the 15 Hz ZED anchor and stored at 15 FPS.
  wrist_left:
    image: /wrist_camera_left/color/image_raw
    camera_info: /wrist_camera_left/color/camera_info
    width: 640
    height: 480
    fps: 15
    record_depth: false
  wrist_right:
    image: /wrist_camera_right/color/image_raw
    camera_info: /wrist_camera_right/color/camera_info
    width: 640
    height: 480
    fps: 15
    record_depth: false

# At 15 Hz, 32 ms remains below half a nominal frame period. Registered
# ZED RGB/depth normally share timestamps; failures remain explicit.
depth_match_tolerance_ms: 32.0
rgb_match_tolerance_ms: 45.0
control_match_tolerance_ms: 50.0
sync_wait_timeout_ms: 100.0
max_message_age_ms: 200.0
sync_history_size: 30
tmr_split_sync_tolerance_ms: 20.0
tmr_split_max_age_ms: 200.0

depth_queue_size: 64
depth_every: 1
reject_episode_on_missing_depth: true
max_episode_time_s: 180.0
max_episodes: 100

streaming_encoding: true
rgb_vcodec: auto
encoder_queue_maxsize: 90
encoder_threads: 2
image_writer_threads: 2
image_writer_processes: 0

# REQUIRED ON SITE. Read the exact position field selected from both Robotiq
# JointState topics at fully closed/open. Do not assume metres, radians, or a
# particular sign. A single shared pair is used, so add a relay first if the
# two grippers expose materially different scales.
gripper_closed_rad: null
gripper_open_rad: null

# Leave null only when each gripper JointState contains exactly one position.
# Otherwise set the exact JointState.name selected for each physical gripper.
tmr_gripper_actual_joint_names:
  left: null
  right: null

# Fill with the calibrated head optical -> robot-base transform before deriving
# robot-base-frame point clouds. Null keeps depth/points in the camera frame.
head_to_robot_base_transform: null
