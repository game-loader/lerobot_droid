# Live TMR camera configuration for eval_franka_duo.py. The exported bundle
# owns point-cloud channels, sampling and model image resize; this file owns
# the ROS topics and source image dimensions.
fps: 15
topics:
  head_image: /head_camera/zed/rgb/color/rect/image
  head_depth: /head_camera/zed/depth/depth_registered
  head_camera_info: /head_camera/zed/rgb/color/rect/camera_info
  wrist_left_image: /wrist_camera_left/color/image_raw
  wrist_right_image: /wrist_camera_right/color/image_raw

  # There is no verified aggregate TMR JointState topic. Pure image/point-cloud
  # bundles do not subscribe to this key. A stateful bundle requires an on-site
  # relay that publishes the recorder's 16D measured semantic contract here.
  joint_states: /franka_duo/semantic_joint_states

cameras:
  head:
    image: /head_camera/zed/rgb/color/rect/image
    depth: /head_camera/zed/depth/depth_registered
    camera_info: /head_camera/zed/rgb/color/rect/camera_info
    width: 1280
    height: 720
    fps: 15
    depth_scale: 0.001
    depth_registered: true
  wrist_left:
    image: /wrist_camera_left/color/image_raw
    camera_info: /wrist_camera_left/color/camera_info
    width: 640
    height: 480
    fps: 15
  wrist_right:
    image: /wrist_camera_right/color/image_raw
    camera_info: /wrist_camera_right/color/camera_info
    width: 640
    height: 480
    fps: 15

rgb_match_tolerance_ms: 45.0
depth_match_tolerance_ms: 32.0
state_match_tolerance_ms: 50.0
max_message_age_ms: 200.0
sync_wait_timeout_ms: 100.0
sync_history_size: 30

# Required only for a stateful bundle, together with the semantic relay above.
# Measure the real endpoints; never copy simulation calibration values.
state_gripper_closed: null
state_gripper_open: null

# Safety relay only. eval remains dry-run unless both --publish and
# --enable-robot are supplied.
publish_topic: /franka_duo/policy_action
inference_timeout_ms: 100.0
